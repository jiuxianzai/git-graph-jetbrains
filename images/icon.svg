<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#182742"/>
    </linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="59" fill="none" stroke="#5eead4" stroke-opacity="0.45" stroke-width="2"/>

  <!-- main lane -->
  <path d="M42 26 V102" fill="none" stroke="url(#main)" stroke-width="8" stroke-linecap="round"/>
  <!-- feature lane + merge -->
  <path d="M86 40 V78" fill="none" stroke="url(#branch)" stroke-width="8" stroke-linecap="round"/>
  <path d="M42 60 C42 78 86 62 86 78" fill="none" stroke="url(#branch)" stroke-width="8" stroke-linecap="round"/>

  <!-- commits -->
  <circle cx="42" cy="26" r="10" fill="#0b1220" stroke="#5eead4" stroke-width="5"/>
  <circle cx="42" cy="60" r="10" fill="#0b1220" stroke="#818cf8" stroke-width="5"/>
  <circle cx="42" cy="102" r="10" fill="#0b1220" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="86" cy="40" r="10" fill="#0b1220" stroke="#f472b6" stroke-width="5"/>
  <circle cx="86" cy="78" r="10" fill="#0b1220" stroke="#c084fc" stroke-width="5"/>
</svg>
